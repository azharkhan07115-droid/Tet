name: Build Android APK

on:
  workflow_dispatch:   # Actions tab me "Run workflow" button se chalega

permissions:
  contents: write      # Release banane ke liye zaroori

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find Android project (zip ho to unzip bhi karega)
        run: |
          find_project() {
            find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.git/*" -not -path "*/node_modules/*" | head -n 1
          }

          SETTINGS="$(find_project)"

          if [ -z "$SETTINGS" ]; then
            echo "Settings file nahi mili, zip files check kar raha hu..."
            i=0
            for z in $(find . -type f -name "*.zip" -not -path "*/.git/*"); do
              i=$((i+1))
              echo "Unzipping $z"
              unzip -q -o "$z" -d "unzipped_$i" || true
            done
            SETTINGS="$(find_project)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Repo me Android project nahi mila (settings.gradle missing). Pura project upload karo."
            ls -R | head -n 80
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"
          echo "Project mila: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ---------- C++ (NDK) tools - OpenCV ab nahi chahiye ----------
      - name: Install NDK + CMake for the C++ vision
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          [ -z "$SDKMANAGER" ] && SDKMANAGER="$(command -v sdkmanager)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      # ---------- Real keystore secrets (optional) ----------
      # Agar yeh 4 repo secrets set hain (Settings -> Secrets and variables -> Actions):
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # to build.gradle khud real keystore se sign karega (recommended - updates ke liye same
      # key chahiye hoti hai, warna purani install ke upar nayi APK install nahi hogi).
      # Nahi hain to APK unsigned banega aur neeche ek throwaway ad-hoc key se sign hoga
      # (sirf is run ke liye - agli build me key badal jayegi).
      - name: Decode keystore (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # ---------- App ka Release APK banao (R8 + native stripping on) ----------
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Collect APK (sign with throwaway key if no real keystore)
        run: |
          mkdir -p output
          APK="$(find "$PROJECT_DIR" -path "*build/outputs/apk/release/*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Koi release APK nahi mili, build step fail hui hogi."
            exit 1
          fi
          if [[ "$APK" == *unsigned* ]]; then
            echo "No real keystore secrets - signing with a throwaway ad-hoc key (install-only, not for updates)."
            BUILD_TOOLS="$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"/build-tools/* | sort -V | tail -n 1)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/adhoc.keystore" -storepass android123 \
              -keypass android123 -alias adhoc -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=CI Build, OU=CI, O=CI, L=CI, S=CI, C=IN"
            "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/adhoc.keystore" --ks-pass pass:android123 \
              --ks-key-alias adhoc --key-pass pass:android123 --out output/app-release.apk "$APK"
          else
            cp "$APK" output/app-release.apk
          fi
          ls -lh output

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: output/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" output/*.apk \
            --title "APK build #${{ github.run_number }}" \
            --notes "Auto-built release APK (R8 + native .so stripped) from commit ${{ github.sha }}"
