name: Build Android APK

on:
  workflow_dispatch:   # Actions tab me "Run workflow" button se chalega

permissions:
  contents: write      # Release banane ke liye zaroori

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find Android project (zip ho to unzip bhi karega)
        run: |
          find_project() {
            find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.git/*" -not -path "*/node_modules/*" | head -n 1
          }

          SETTINGS="$(find_project)"

          if [ -z "$SETTINGS" ]; then
            echo "Settings file nahi mili, zip files check kar raha hu..."
            i=0
            for z in $(find . -type f -name "*.zip" -not -path "*/.git/*"); do
              i=$((i+1))
              echo "Unzipping $z"
              unzip -q -o "$z" -d "unzipped_$i" || true
            done
            SETTINGS="$(find_project)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Repo me Android project nahi mila (settings.gradle missing). Pura project upload karo."
            ls -R | head -n 80
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"
          echo "Project mila: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ---------- C++ (NDK) tools - OpenCV ab nahi chahiye ----------
      - name: Install NDK + CMake for the C++ vision
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          [ -z "$SDKMANAGER" ] && SDKMANAGER="$(command -v sdkmanager)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # ---------- App ka APK banao ----------
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR" -path "*build/outputs/apk/debug/*.apk" -exec cp {} output/ \;
          ls -lh output

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output/*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" output/*.apk \
            --title "APK build #${{ github.run_number }}" \
            --notes "Auto-built debug APK (C++ vision, no OpenCV) from commit ${{ github.sha }}"
